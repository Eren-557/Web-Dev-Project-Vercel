<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
    <title>Snake Game</title>

</head>
<body>
    
    <main>
        <section>

            <div class="infos">

                <div class="info">
                    <h3>High Score: 
                        <span id="highs-score">0</span>
                    </h3>
                </div>

                <div class="info">
                    <h3>Score: 
                        <span id="score">0</span>
                    </h3>
                </div>

                <div class="info">
                    <h3>Time: 
                        <span id="time">0</span>
                    </h3>
                </div>                

            </div>


            <div class="board">

            </div>

        </section>



        <div class="modal">

            <div class="start-game">
                <h3>Welcome to the Snake Game</h3>
                <button class="btn start-btn">Start Game</button>
            </div>

            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn restart-btn">Restart</button>
            </div>

        </div>

        <div class="game-difficulty">

            <h2>Choose Game Difficulty</h2>


            <div class="difficulty-btns">
                <button class="btn easy-btn">Easy</button>
                <button class="btn medium-btn">Medium</button>
                <button class="btn hard-btn">Hard</button>
            </div>


        </div>




    </main>



    <script src="script.js"></script>
</body>
</html>
